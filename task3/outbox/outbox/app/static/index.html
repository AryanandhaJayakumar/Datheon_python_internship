<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outbox: send notifications in the background</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eef3; --panel:#ffffff; --ink:#13202c; --muted:#5d6b78; --line:#d5dde5;
  --accent:#0b7fbf; --accent-ink:#ffffff; --accent-soft:#e1f1fa;
  --ok:#12805c; --ok-soft:#dff3ea; --warn:#a85008; --warn-soft:#fbead8; --bad:#b3261e; --bad-soft:#fbe3e1;
  --head:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:40px 20px 64px}
header{margin-bottom:28px}
h1{font:700 clamp(2rem,5vw,3rem)/1.05 var(--head);margin:0 0 8px;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);max-width:52ch}
.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
h2{font:600 1.15rem/1.2 var(--head);margin:0 0 16px}

/* form */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:18px}
.seg button{border:0;background:none;padding:9px;border-radius:7px;font:500 .95rem var(--body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(19,32,44,.18)}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}
.field{margin-bottom:16px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px}
textarea{resize:vertical;min-height:96px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem;margin-top:5px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid transparent;border-radius:9px;padding:11px 18px;font:600 1rem var(--body);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);flex:1}
.btn.primary:hover{background:#09699c}
.btn.ghost{background:none;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--bg)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.error{display:none;margin-top:14px;padding:10px 12px;border-radius:9px;background:var(--bad-soft);color:var(--bad);font-size:.92rem}
.error.show{display:block}

/* rate meter: the memorable element */
.meter{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.pips{display:flex;gap:6px;margin-bottom:8px}
.pip{flex:1;height:14px;border-radius:4px;background:var(--accent);transition:background .3s,transform .3s}
.pip.used{background:var(--line)}
.pip.just{transform:scaleY(1.5)}
.meter.empty .pip.used{background:var(--bad)}
.meter p{margin:0;color:var(--muted);font-size:.9rem}
.meter strong{color:var(--ink)}

/* activity */
.list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.job{border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.job-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.who{min-width:0}
.who b{display:block;overflow-wrap:anywhere;font-weight:600}
.who span{display:block;color:var(--muted);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{flex:none;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.delivered{background:var(--ok-soft);color:var(--ok)}
.chip.sending{background:var(--warn-soft);color:var(--warn)}
.chip.failed{background:var(--bad-soft);color:var(--bad)}
.track{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 0 8px;gap:4px}
.step{font-size:.78rem;color:var(--muted);padding-top:8px;border-top:3px solid var(--line);border-radius:2px}
.step.on{border-top-color:var(--accent);color:var(--ink)}
.step.on.pulse{animation:pulse 1.1s ease-in-out infinite}
.job.is-delivered .step.on{border-top-color:var(--ok)}
.job.is-failed .step.on{border-top-color:var(--bad)}
@keyframes pulse{50%{border-top-color:var(--warn)}}
.detail{margin:0;color:var(--muted);font-size:.85rem}
.empty-state{text-align:center;color:var(--muted);padding:36px 12px;border:1.5px dashed var(--line);border-radius:11px}
.empty-state b{display:block;color:var(--ink);margin-bottom:4px}
.foot{margin-top:28px;color:var(--muted);font-size:.88rem}
.foot a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Outbox</h1>
    <p>Send an email or a webhook. Your request returns right away and the delivery happens in the background.</p>
  </header>

  <div class="grid">
    <section class="panel" aria-labelledby="send-title">
      <h2 id="send-title">New notification</h2>

      <div class="seg" role="group" aria-label="Channel">
        <button type="button" id="ch-email" aria-pressed="true">Email</button>
        <button type="button" id="ch-webhook" aria-pressed="false">Webhook</button>
      </div>

      <div class="field">
        <label for="target" id="target-label">Recipient email</label>
        <input id="target" type="text" autocomplete="off" placeholder="name@example.com">
      </div>
      <div class="field" id="subject-field">
        <label for="subject">Subject</label>
        <input id="subject" type="text" maxlength="150" placeholder="Your order has shipped">
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" maxlength="2000" placeholder="Write the message you want to deliver"></textarea>
        <div class="hint"><span id="msg-hint">Plain text</span><span id="count">0 / 2000</span></div>
      </div>

      <div class="actions">
        <button class="btn primary" id="send" type="button">Queue notification</button>
        <button class="btn ghost" id="burst" type="button" title="Sends 6 quick emails so you can see the rate limit trigger">Test rate limit</button>
      </div>
      <div class="error" id="error" role="alert"></div>

      <div class="meter" id="meter" aria-live="polite">
        <div class="pips" id="pips"></div>
        <p id="meter-text">Checking your send allowance</p>
      </div>
    </section>

    <section class="panel" aria-labelledby="act-title">
      <h2 id="act-title">Activity</h2>
      <ul class="list" id="jobs"></ul>
    </section>
  </div>

  <p class="foot">API docs are at <a href="/docs">/docs</a>. Email is simulated unless SMTP settings are configured on the server.</p>
</div>

<script>
const $ = s => document.querySelector(s);
let channel = "email", rl = {limit: 5, remaining: 5}, resetAt = 0, lastJobs = "", justUsed = false;

function setChannel(c){
  channel = c;
  $("#ch-email").setAttribute("aria-pressed", c === "email");
  $("#ch-webhook").setAttribute("aria-pressed", c === "webhook");
  $("#target-label").textContent = c === "email" ? "Recipient email" : "Webhook URL";
  $("#target").placeholder = c === "email" ? "name@example.com" : "https://example.com/hooks/orders";
  $("#subject-field").style.display = c === "email" ? "" : "none";
  $("#msg-hint").textContent = c === "email" ? "Plain text" : "Sent to your URL as JSON";
  showError("");
}
function showError(t){ const e = $("#error"); e.textContent = t; e.classList.toggle("show", !!t); }

/* ----- rate meter ----- */
function renderMeter(){
  const m = $("#meter"), pips = $("#pips");
  pips.replaceChildren();
  for (let i = 0; i < rl.limit; i++){
    const p = document.createElement("span");
    const used = i >= rl.remaining;
    p.className = "pip" + (used ? " used" : "") + (used && justUsed && i === rl.limit - rl.remaining - 1 ? " just" : "");
    pips.appendChild(p);
  }
  justUsed = false;
  m.classList.toggle("empty", rl.remaining === 0);
  tick();
}
function tick(){
  const left = Math.max(0, Math.ceil((resetAt - Date.now()) / 1000));
  const t = $("#meter-text");
  t.replaceChildren();
  const b = document.createElement("strong");
  b.textContent = `${rl.remaining} of ${rl.limit}`;
  t.append(b, rl.remaining === 1 ? " send left" : " sends left");
  t.append(left > 0 ? `. Resets in ${left}s.` : ".");
  if (resetAt && left === 0 && rl.remaining < rl.limit){ resetAt = 0; loadLimit(); }
}
function applyLimit(limit, remaining, reset){
  rl = {limit, remaining};
  resetAt = reset > 0 ? Date.now() + reset * 1000 : 0;
  renderMeter();
}
function readHeaders(h){
  if (h.get("X-RateLimit-Limit")) {
    justUsed = true;
    applyLimit(+h.get("X-RateLimit-Limit"), +h.get("X-RateLimit-Remaining"), +h.get("X-RateLimit-Reset"));
  }
}
async function loadLimit(){
  try { const d = await (await fetch("/api/rate-limit")).json(); applyLimit(d.limit, d.remaining, d.reset_in); } catch {}
}

/* ----- sending ----- */
function errorText(data, status){
  if (typeof data.detail === "string") return data.detail;
  if (Array.isArray(data.detail) && data.detail.length){
    const d = data.detail[0], field = (d.loc || []).slice(-1)[0];
    const msg = (d.msg || "").replace(/^Value error, /, "");
    return field && field !== "body" ? `${field}: ${msg}` : msg;
  }
  return `Something went wrong (status ${status}). Try again.`;
}
async function post(payload){
  const r = await fetch("/api/notifications", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)});
  readHeaders(r.headers);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(errorText(data, r.status));
  return data;
}
$("#send").addEventListener("click", async () => {
  const btn = $("#send"); showError("");
  const payload = {channel, target: $("#target").value.trim(), subject: $("#subject").value.trim(), message: $("#message").value.trim()};
  if (!payload.target){ showError(channel === "email" ? "Enter a recipient email." : "Enter a webhook URL."); return; }
  if (!payload.message){ showError("Write a message to send."); return; }
  btn.disabled = true;
  try { await post(payload); $("#message").value = ""; $("#count").textContent = "0 / 2000"; await loadJobs(true); }
  catch (e){ showError(e.message); }
  finally { btn.disabled = false; }
});
$("#burst").addEventListener("click", async () => {
  const btn = $("#burst"); showError(""); btn.disabled = true;
  for (let i = 1; i <= 6; i++){
    try { await post({channel: "email", target: "demo@example.com", subject: `Test ${i}`, message: `Rate limit test number ${i}`}); }
    catch (e){ showError(e.message); break; }
  }
  await loadJobs(true); btn.disabled = false;
});
$("#message").addEventListener("input", e => $("#count").textContent = `${e.target.value.length} / 2000`);
$("#ch-email").onclick = () => setChannel("email");
$("#ch-webhook").onclick = () => setChannel("webhook");

/* ----- activity feed ----- */
const STEPS = ["Queued", "Sending", "Delivered"];
function jobEl(j){
  const li = document.createElement("li");
  li.className = "job is-" + j.status;
  const top = document.createElement("div"); top.className = "job-top";
  const who = document.createElement("div"); who.className = "who";
  const b = document.createElement("b"); b.textContent = (j.channel === "email" ? "Email to " : "Webhook to ") + j.target;
  const s = document.createElement("span"); s.textContent = j.subject || j.message;
  who.append(b, s);
  const chip = document.createElement("span"); chip.className = "chip " + j.status;
  chip.textContent = j.status === "failed" ? "Failed" : STEPS[{queued: 0, sending: 1, delivered: 2}[j.status]];
  top.append(who, chip);
  const reached = j.status === "queued" ? 0 : j.status === "sending" ? 1 : 2;
  const track = document.createElement("div"); track.className = "track";
  STEPS.forEach((name, i) => {
    const st = document.createElement("div");
    st.className = "step" + (i <= reached ? " on" : "") + (j.status === "sending" && i === 1 ? " pulse" : "");
    st.textContent = name; track.appendChild(st);
  });
  const d = document.createElement("p"); d.className = "detail";
  const time = new Date(j.created_at).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
  d.textContent = `${time}. ${j.detail}` + (j.attempts > 1 ? ` (attempt ${j.attempts})` : "");
  li.append(top, track, d);
  return li;
}
async function loadJobs(force){
  try {
    const text = await (await fetch("/api/jobs")).text();
    if (!force && text === lastJobs) return;
    lastJobs = text;
    const jobs = JSON.parse(text), ul = $("#jobs");
    ul.replaceChildren();
    if (!jobs.length){
      const li = document.createElement("li"); li.className = "empty-state";
      const b = document.createElement("b"); b.textContent = "Nothing sent yet";
      li.append(b, "Queue a notification and its progress will appear here.");
      ul.appendChild(li); return;
    }
    jobs.forEach(j => ul.appendChild(jobEl(j)));
  } catch {}
}

setChannel("email"); renderMeter(); loadLimit(); loadJobs(true);
setInterval(loadJobs, 1200);
setInterval(tick, 500);
</script>
</body>
</html>
